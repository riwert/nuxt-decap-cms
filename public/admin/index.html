<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS</title>
    <!-- Include the script that enables Netlify Identity on this page. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="https://unpkg.com/decap-cms-locales@^3.0.0/dist/locales/pl.js" onload="initCMS()"></script>
    <script>
      function initCMS() {
        // Rejestracja języka po załadowaniu locale
        CMS.registerLocale('pl', CMS.locales.pl);

        // Inicjalizacja CMS
        CMS.init({
          config: {
            backend: {
              name: 'git-gateway',
              branch: 'main',
            },
            i18n: {
              structure: 'single',
              default_locale: 'pl',
            },
          },
        });
      }
    </script>
  </body>
</html>
