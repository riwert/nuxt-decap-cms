# disable in production:
local_backend: true
# command to run a local Decap instance: npx-decap-server

backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
  commit_messages:
    create: "Dodano {{collection}} „{{slug}}”"
    update: "Zaktualizowano {{collection}} „{{slug}}”"
    delete: "Usunięto {{collection}} „{{slug}}”"

# Tłumaczenia / etykiety
i18n:
  structure: single
  locales:
    - pl
  default_locale: pl
  strings:
    add: "Dodaj"
    remove: "Usuń"
    create_new: "Utwórz nowy"
    save: "Zapisz"
    cancel: "Anuluj"
    edit: "Edytuj"
    delete: "Usuń"
    duplicate: "Duplikuj"
    publish: "Opublikuj"
    unpublish: "Cofnij publikację"
    open_preview: "Podgląd"
    close_preview: "Zamknij podgląd"
    search: "Szukaj"
    filter: "Filtruj"
    sort: "Sortuj"
    move_up: "Przenieś w górę"
    move_down: "Przenieś w dół"

    # Formularze i pola
    required_field: "Pole wymagane"
    optional_field: "Pole opcjonalne"
    invalid_value: "Nieprawidłowa wartość"
    select_option: "Wybierz opcję"

    # Status i powiadomienia
    published: "Opublikowano"
    draft: "Szkic"
    changed: "Zmiany zapisane"
    unsaved_changes: "Masz niezapisane zmiany"
    error_saving: "Błąd podczas zapisu"
    loading: "Ładowanie..."
    no_entries: "Brak wpisów"
    entries_found: "{count} wpisów znaleziono"

    # Nawigacja i menu
    back: "Powrót"
    home: "Strona główna"
    settings: "Ustawienia"
    configuration: "Konfiguracja"
    content: "Treść"
    collections: "Kolekcje"
    single_types: "Typy pojedyncze"

    # Dodatkowe tłumaczenia
    "Contents": "Zawartości"
    "Collections": "Administracja"
    "Search all": "Szukaj..."
    "Quick add": "Szybko Dodaj"
    "Sorty by": "Sortuj wg"
    "Media Library": "Biblioteka Multimediów"
    "Log Out": "Wyloguj"

media_folder: "public/upload"
public_folder: "/"

site_url: https://nuxtdecap.netlify.app

media_library:
  name: cloudinary
  # output_filename_only: true
  config:
    cloud_name: dgdoyeu6y
    api_key: 391131789616344

# Component SEO for pages
seo: &seo
  name: "SEOmetaData"
  label: "SEO"
  widget: "object"
  collapsed: true
  fields:
    - {
        name: "metaTitle",
        label: "SEO Title",
        widget: "string",
        required: false,
      }
    - {
        name: "metaDescription",
        label: "SEO Description",
        widget: "string",
        pattern: [".{20,160}", "between 20 and 160 characters"],
        required: false,
        hint: "must be between 20 and 160 characters",
      }
    - { name: "metaImage", label: "SEO image", widget: "image", required: false }
    - {
        name: "keywords",
        label: "Keywords",
        widget: "string",
        hint: "keywords are comma separated",
        required: false,
      }

collections:
  # PAGES
  - name: "pages"
    label: "Strony"
    folder: "content"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    sortable_fields: ["order"]
    fields:
      - { name: "body", label: "Zawartość", widget: "markdown" }
      - { name: "title", label: "Tytuł (title)", widget: "string" }
      - { name: "description", label: "Opis (description)", widget: "string" }
      - *seo
      - label: "Kolejność"
        name: "order"
        widget: "number"
        default: 0
        hint: "Kolejność elementów w menu"
      - label: "Ukryj"
        name: "hidden"
        widget: "boolean"
        default: false

  # Global Site Configuration
  - name: "configs"
    label: "Konfiguracja"
    files:
      - label: "Ustawienia Strony"
        name: "settings"
        file: "content/config/settings.json"
        fields:
          - { label: "Nazwa Strony", name: "siteName", widget: "string" }
          - { label: "Adres URL Strony", name: "siteUrl", widget: "string" }
          - { label: "Logo Strony", name: "logo", widget: "image" }
          - { label: "Favicona Strony", name: "favicon", widget: "image" }
          - {
              label: "Główny Kolor Strony",
              name: "themeColor",
              widget: "color",
              enableAlpha: true,
            }
          - {
              label: "ID Analityki Strony",
              name: "analyticsId",
              widget: "string",
              required: false,
            }

      - label: "Etykiety Przycisków"
        name: "buttons"
        file: "content/config/buttons.json"
        fields:
          - { label: "Następny", name: "next", widget: "string", default: "Następny" }
          - { label: "Poprzedni", name: "previous", widget: "string", default: "Poprzedni" }
          - { label: "Zamknij", name: "close", widget: "string", default: "Zamknij" }
          - {
              label: "Artykuł: Więcej",
              name: "article",
              widget: "string",
              default: "Zobacz więcej",
            }
          - { label: "Formularz: Wyślij", name: "send", widget: "string", default: "Wyślij" }

      - label: "Linki Społecznościowe"
        name: "socials"
        file: "content/config/social-links.json"
        fields:
          - {
              label: "Facebook",
              name: "facebook",
              widget: "string",
              required: false,
            }
          - {
              label: "Twitter",
              name: "twitter",
              widget: "string",
              required: false,
            }
          - {
              label: "Instagram",
              name: "instagram",
              widget: "string",
              required: false,
            }
          - {
              label: "LinkedIn",
              name: "linkedin",
              widget: "string",
              required: false,
            }
